<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 基础背景渐变：清新冰川白到淡海空蓝 -->
    <linearGradient id="canvasBg" x1="0.2" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F4F9FD" />
      <stop offset="100%" stop-color="#E3EEF8" />
    </linearGradient>

    <!-- 图标边缘高光描边 -->
    <linearGradient id="rimBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#B9CEE3" stop-opacity="0.6" />
    </linearGradient>

    <!-- 主屏幕（Mac屏幕）渐变：清澈湛蓝到海蓝宝石 -->
    <linearGradient id="macScreen" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 副屏（拓展屏幕）渐变：轻快晨光青与薄荷绿 -->
    <linearGradient id="extScreen" x1="0.0" y1="1.0" x2="1.0" y2="0.0">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- 玻璃光泽反光 -->
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 副屏外光晕 -->
    <filter id="extGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.05
        0 0 0 0 0.75
        0 0 0 0 0.85
        0 0 0 0.35 0" />
    </filter>

    <!-- 主阴影：Apple 多级立体悬浮阴影 -->
    <filter id="appShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="36" stdDeviation="38" flood-color="#0c2340" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0c2340" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0c2340" flood-opacity="0.06" />
    </filter>

    <!-- 卡片浮空小阴影 -->
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#03254c" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#03254c" flood-opacity="0.10" />
    </filter>

    <!-- 拓展副屏阴影 -->
    <filter id="extShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#04324f" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04324f" flood-opacity="0.12" />
    </filter>

    <!-- 细支架渐变 -->
    <linearGradient id="standGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- 信号光束渐变 -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- 1. 底层大 Squircle 底板 -->
  <g filter="url(#appShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#canvasBg)" />
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#rimBorder)" stroke-width="2.5" />
  </g>

  <!-- 2. 主机显示器支架（极简铝合金 Studio Display 支架） -->
  <g opacity="0.95">
    <!-- 立柱 -->
    <path d="M395,580 L445,580 L435,660 L405,660 Z" fill="url(#standGrad)" />
    <!-- 底座 -->
    <rect x="350" y="656" width="140" height="12" rx="6" fill="#CBD5E1" />
    <rect x="352" y="656" width="136" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7" />
  </g>

  <!-- 3. 主屏幕（Mac Screen） -->
  <g filter="url(#floatShadow)">
    <!-- 外壳外框（纯白陶瓷质感） -->
    <rect x="200" y="320" width="440" height="290" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <!-- 屏幕玻璃黑边内圈 -->
    <rect x="214" y="334" width="412" height="262" rx="16" fill="#0F172A" />
    <!-- 屏幕绚丽蓝绿渐变 -->
    <rect x="216" y="336" width="408" height="258" rx="14" fill="url(#macScreen)" />
    
    <!-- 主屏内流动丝滑微弧线（增强空间感） -->
    <path d="M216,500 C300,430 450,570 624,420 L624,594 L216,594 Z" fill="#0369A1" opacity="0.4" />
    <path d="M216,530 C320,480 470,590 624,460 L624,594 L216,594 Z" fill="#0284C7" opacity="0.4" />
    <path d="M216,560 C350,520 490,610 624,510 L624,594 L216,594 Z" fill="#38BDF8" opacity="0.3" />

    <!-- 玻璃斜切反光 -->
    <path d="M216,336 L440,336 L216,560 Z" fill="url(#glassSheen)" />
  </g>

  <!-- 4. 拓展副屏的光晕背景 -->
  <rect x="470" y="240" width="370" height="250" rx="22" fill="#10B981" opacity="0.2" filter="url(#extGlow)" />

  <!-- 5. 拓展副屏（Companion Display · 悬浮半透高亮） -->
  <g filter="url(#extShadow)">
    <!-- 外框（通透亮白微发光） -->
    <rect x="460" y="230" width="370" height="250" rx="22" fill="#FFFFFF" opacity="0.96" stroke="#38BDF8" stroke-width="2.5" />
    <!-- 屏幕黑边内圈 -->
    <rect x="472" y="242" width="346" height="226" rx="14" fill="#064E3B" opacity="0.8" />
    <!-- 清新薄荷/晨光渐变 -->
    <rect x="474" y="244" width="342" height="222" rx="12" fill="url(#extScreen)" />

    <!-- 副屏内丝滑弧线 -->
    <path d="M474,380 C540,320 680,420 816,330 L816,466 L474,466 Z" fill="#059669" opacity="0.45" />
    <path d="M474,410 C560,370 710,430 816,370 L816,466 L474,466 Z" fill="#10B981" opacity="0.4" />

    <!-- 副屏玻璃反光 -->
    <path d="M474,244 L680,244 L474,450 Z" fill="url(#glassSheen)" />

    <!-- 右上角点对点高清绿钻指示灯 -->
    <circle cx="788" cy="272" r="6" fill="#FFFFFF" />
    <circle cx="788" cy="272" r="4.5" fill="#34D399" />
  </g>

  <!-- 6. 随航无线流连结纽带（灵动无线电波弧光） -->
  <g>
    <!-- 发射光波 1 -->
    <path d="M 460,390 A 40,40 0 0,1 460,450" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.95" />
    <path d="M 460,390 A 40,40 0 0,1 460,450" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    
    <!-- 发射光波 2 -->
    <path d="M 445,372 A 65,65 0 0,1 445,468" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 445,372 A 65,65 0 0,1 445,468" fill="none" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- 发射光波 3 -->
    <path d="M 430,354 A 90,90 0 0,1 430,486" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 430,354 A 90,90 0 0,1 430,486" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- 核心能量点 -->
    <circle cx="480" cy="420" r="8" fill="#FFFFFF" filter="url(#extGlow)" />
    <circle cx="480" cy="420" r="5" fill="#00E5FF" />
  </g>

  <!-- 7. 顶部微妙微米级透亮反光（给整块 Squircle 增加 macOS 质感） -->
  <path d="M 285,101 L 739,101 C 820,101 880,140 900,220 C 700,260 324,260 124,220 C 144,140 204,101 285,101 Z" fill="#FFFFFF" opacity="0.3" />
</svg>