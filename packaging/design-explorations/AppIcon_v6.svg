<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 极简清新白玉底板 -->
    <linearGradient id="canvasBg" x1="0.1" y1="0.0" x2="0.9" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFD" />
      <stop offset="100%" stop-color="#EBF3FA" />
    </linearGradient>

    <!-- 精致外框微高光描边 -->
    <linearGradient id="canvasBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.55" />
    </linearGradient>

    <!-- 主屏：清澈湛蓝到晴空青 -->
    <linearGradient id="blueScreen" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 副屏：春草薄荷绿到青碧 -->
    <linearGradient id="mintScreen" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- 顶层透亮高光 -->
    <linearGradient id="screenSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 底部大悬浮阴影 -->
    <filter id="appShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="30" stdDeviation="32" flood-color="#0f2b48" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f2b48" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2b48" flood-opacity="0.05" />
    </filter>

    <!-- 双屏立体悬浮阴影 -->
    <filter id="blueShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0369a1" flood-opacity="0.26" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.14" />
    </filter>

    <filter id="mintShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#065f46" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#065f46" flood-opacity="0.16" />
    </filter>

    <filter id="softAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- 1. 纯白极简 Squircle 底板 -->
  <g filter="url(#appShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#canvasBg)" />
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#canvasBorder)" stroke-width="2.5" />
  </g>

  <!-- 2. 背景微弱的环境光晕（增添通透与清新的灵动感） -->
  <circle cx="360" cy="440" r="160" fill="#38BDF8" opacity="0.16" filter="url(#softAura)" />
  <circle cx="660" cy="540" r="160" fill="#34D399" opacity="0.16" filter="url(#softAura)" />

  <!-- 3. 左上主屏幕（Mac 屏幕）: 纯净悬浮板 -->
  <g filter="url(#blueShadow)">
    <!-- 纯白一体外框 -->
    <rect x="200" y="290" width="430" height="290" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- 屏幕黑边内圈 -->
    <rect x="212" y="302" width="406" height="266" rx="16" fill="#0F172A" />
    <!-- 湛蓝液晶屏 -->
    <rect x="214" y="304" width="402" height="262" rx="14" fill="url(#blueScreen)" />

    <!-- 极简柔和极光光弧 -->
    <path d="M214,460 C290,400 420,510 616,390 L616,566 L214,566 Z" fill="#0284C7" opacity="0.5" />
    <path d="M214,500 C310,450 450,530 616,440 L616,566 L214,566 Z" fill="#38BDF8" opacity="0.4" />

    <!-- 屏幕玻璃反光 -->
    <path d="M214,304 L420,304 L214,510 Z" fill="url(#screenSheen)" />

    <!-- 视网膜摄像头点 -->
    <circle cx="415" cy="296" r="2.5" fill="#CBD5E1" />
  </g>

  <!-- 4. 右下拓展屏幕（随航副屏）: 纯白亮面外框 + 清新春草薄荷绿 -->
  <g filter="url(#mintShadow)">
    <!-- 纯白外框 -->
    <rect x="410" y="390" width="414" height="280" rx="24" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2" />
    <!-- 屏幕黑边内圈 -->
    <rect x="422" y="402" width="390" height="256" rx="15" fill="#064E3B" />
    <!-- 翠绿液晶屏 -->
    <rect x="424" y="404" width="386" height="252" rx="13" fill="url(#mintScreen)" />

    <!-- 极简柔和极光光弧 -->
    <path d="M424,530 C500,460 630,590 810,470 L810,656 L424,656 Z" fill="#059669" opacity="0.5" />
    <path d="M424,570 C530,510 660,610 810,520 L810,656 L424,656 Z" fill="#34D399" opacity="0.4" />

    <!-- 屏幕玻璃反光 -->
    <path d="M424,404 L620,404 L424,600 Z" fill="url(#screenSheen)" />

    <!-- 状态指示点 -->
    <circle cx="785" cy="430" r="5.5" fill="#FFFFFF" />
    <circle cx="785" cy="430" r="4" fill="#10B981" />
  </g>

  <!-- 5. 极简无线随航波纹（纯白与薄荷绿圆润光弧） -->
  <g>
    <path d="M 400,475 A 32,32 0 0,1 400,535" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <path d="M 400,475 A 32,32 0 0,1 400,535" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />

    <path d="M 380,458 A 52,52 0 0,1 380,552" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M 380,458 A 52,52 0 0,1 380,552" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

    <!-- 能量核心 -->
    <circle cx="415" cy="505" r="6.5" fill="#FFFFFF" />
    <circle cx="415" cy="505" r="4.5" fill="#00E5FF" />
  </g>
</svg>