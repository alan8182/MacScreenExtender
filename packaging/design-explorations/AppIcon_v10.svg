<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景：纯净温润的极简冷白微晶 -->
    <linearGradient id="snowBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFD" />
      <stop offset="100%" stop-color="#EAF1F8" />
    </linearGradient>

    <linearGradient id="snowRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D5E2EE" />
    </linearGradient>

    <!-- 底板柔和投影 -->
    <filter id="tileDrop" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#2a4563" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a4563" flood-opacity="0.06" />
    </filter>

    <!-- 主屏：明澈蔚蓝玻璃质感 (主控端 Mac) -->
    <linearGradient id="macScreenGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1488CC" />
      <stop offset="100%" stop-color="#2B32B2" />
    </linearGradient>

    <!-- 拓展屏：生机薄荷青绿玻璃质感 (拓展端 Windows/Receiver) -->
    <linearGradient id="extScreenGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- 柔和阴影 -->
    <filter id="macDispShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#1b2a4a" flood-opacity="0.25" />
    </filter>

    <filter id="extDispShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#0b385e" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b385e" flood-opacity="0.12" />
    </filter>

    <!-- 玻璃流光 -->
    <linearGradient id="glassGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 弥散环境光 -->
    <radialGradient id="softAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- 1. Squircle 底板 -->
  <g filter="url(#tileDrop)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#snowBase)" />
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#snowRim)" stroke-width="2" />
  </g>

  <!-- 环境柔光球 -->
  <circle cx="512" cy="512" r="320" fill="url(#softAura)" />

  <!-- 2. 后屏 (Mac 端主屏 - 宝石深蓝) -->
  <g filter="url(#macDispShadow)">
    <rect x="210" y="260" width="440" height="310" rx="32" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="4" />
    <rect x="226" y="276" width="408" height="278" rx="20" fill="url(#macScreenGlass)" />
    <!-- 屏内极简壁纸流线 -->
    <path d="M 226,450 C 310,390 420,490 634,390 L 634,554 L 226,554 Z" fill="#FFFFFF" opacity="0.16" />
    <!-- 玻璃反光 -->
    <path d="M 226,276 L 470,276 L 226,520 Z" fill="url(#glassGloss)" />
  </g>

  <!-- 3. 前屏 (随航拓展副屏 - 天青湖水蓝) -->
  <g filter="url(#extDispShadow)">
    <rect x="374" y="420" width="440" height="310" rx="32" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="4" />
    <rect x="390" y="436" width="408" height="278" rx="20" fill="url(#extScreenGlass)" />
    <!-- 屏内极简壁纸流线 (跨屏呼应) -->
    <path d="M 390,570 C 474,510 584,610 798,510 L 798,714 L 390,714 Z" fill="#FFFFFF" opacity="0.22" />
    <!-- 玻璃反光 -->
    <path d="M 390,436 L 634,436 L 390,680 Z" fill="url(#glassGloss)" />
  </g>

  <!-- 4. 双屏随航连接能量波 (优雅悬浮于负空间) -->
  <g>
    <path d="M 338,368 C 364,342 404,342 430,368" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <path d="M 350,380 C 370,360 400,360 420,380" fill="none" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="384" cy="395" r="4.5" fill="#0284C7" />
  </g>
</svg>
