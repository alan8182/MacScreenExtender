<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景：极致纯净透亮的苹果晨曦渐变 (天蓝到青绿) -->
    <linearGradient id="bgFresh" x1="0.1" y1="0.0" x2="0.9" y2="1.0">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#34C759" />
    </linearGradient>

    <!-- 顶弧环境高光 -->
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 边框高光描边 -->
    <linearGradient id="rimStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <!-- 底板微柔阴影 -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="36" stdDeviation="32" flood-color="#002b4d" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#002b4d" flood-opacity="0.15" />
    </filter>

    <!-- 磨砂亚克力玻璃主体投影 -->
    <filter id="glassShadowBack" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#001830" flood-opacity="0.32" />
    </filter>
    <filter id="glassShadowFront" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#001020" flood-opacity="0.40" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001020" flood-opacity="0.20" />
    </filter>

    <!-- 纯白高光微晶边框渐变 -->
    <linearGradient id="bezelWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 纯白磨砂玻璃表面 -->
    <linearGradient id="glassFace1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="glassFace2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- 极简内部微光流线 -->
    <linearGradient id="innerBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#00C7BE" />
    </linearGradient>

    <linearGradient id="innerBeam2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#34C759" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle 外壳 -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgFresh)" />
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#rimStroke)" stroke-width="2.5" />
    <path d="M 285,101 L 739,101 C 820,101 880,140 900,220 C 700,260 324,260 124,220 C 144,140 204,101 285,101 Z" fill="url(#topGlow)" />
  </g>

  <!-- 2. 后层：主屏幕 (纯白轻拟态悬浮面板) -->
  <g filter="url(#glassShadowBack)">
    <rect x="200" y="240" width="460" height="320" rx="36" fill="url(#glassFace1)" stroke="#FFFFFF" stroke-width="4" />
    <!-- 极简内屏框架 -->
    <rect x="224" y="264" width="412" height="272" rx="22" fill="#0F172A" opacity="0.06" />
    <!-- 屏内核心图案：无线随航投射波 -->
    <path d="M 330,410 C 370,360 450,360 490,410" fill="none" stroke="url(#innerBeam)" stroke-width="12" stroke-linecap="round" />
    <path d="M 360,440 C 385,410 435,410 460,440" fill="none" stroke="url(#innerBeam)" stroke-width="10" stroke-linecap="round" />
    <circle cx="410" cy="466" r="8" fill="#007AFF" />
  </g>

  <!-- 3. 前层：扩展副屏 (纯净高质感微晶面板) -->
  <g filter="url(#glassShadowFront)">
    <rect x="364" y="420" width="460" height="320" rx="36" fill="url(#glassFace2)" stroke="#FFFFFF" stroke-width="4" />
    <!-- 极简内屏框架 -->
    <rect x="388" y="444" width="412" height="272" rx="22" fill="#0F172A" opacity="0.04" />
    <!-- 屏内延展流光：与主屏无缝呼应的扩展光轨 -->
    <path d="M 460,620 L 530,550 C 560,520 620,520 650,550 L 720,620" fill="none" stroke="url(#innerBeam2)" stroke-width="12" stroke-linecap="round" />
    <circle cx="590" cy="535" r="9" fill="#34C759" />
    <!-- 极简拓展屏指示标 (极小极精致) -->
    <rect x="560" y="670" width="60" height="6" rx="3" fill="#CBD5E1" />
  </g>
</svg>
