<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景：通透晨光蓝绿 (经典 Apple 清新风格) -->
    <linearGradient id="bgMorning" x1="0.1" y1="0.0" x2="0.9" y2="1.0">
      <stop offset="0%" stop-color="#0072FF" />
      <stop offset="45%" stop-color="#00C4FF" />
      <stop offset="80%" stop-color="#00E699" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>

    <!-- 顶部柔和天光 -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 图标边缘微米高光 -->
    <linearGradient id="rimGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Squircle 大阴影 -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="32" stdDeviation="30" flood-color="#002642" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#002642" flood-opacity="0.14" />
    </filter>

    <!-- 屏幕投影 -->
    <filter id="shadowBack" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#001424" flood-opacity="0.28" />
    </filter>
    <filter id="shadowFront" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="32" stdDeviation="26" flood-color="#00101c" flood-opacity="0.36" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00101c" flood-opacity="0.18" />
    </filter>

    <!-- 视网膜极光壁纸渐变 (深海蓝到活力青绿) -->
    <linearGradient id="wallBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A30" />
      <stop offset="50%" stop-color="#0F3854" />
      <stop offset="100%" stop-color="#0A5243" />
    </linearGradient>

    <linearGradient id="wallFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A3644" />
      <stop offset="50%" stop-color="#0B5C4B" />
      <stop offset="100%" stop-color="#127A59" />
    </linearGradient>

    <!-- 贯穿两屏的无界流光极光带 -->
    <linearGradient id="auroraRibbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#55FFB0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 玻璃光泽切角 -->
    <linearGradient id="glassGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 磨砂质感内框 -->
    <linearGradient id="bezelWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBF1F6" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle 外壳 -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgMorning)" />
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#rimGlow)" stroke-width="2.5" />
    <path d="M 285,101 L 739,101 C 820,101 880,140 900,220 C 700,260 324,260 124,220 C 144,140 204,101 285,101 Z" fill="url(#topSheen)" />
  </g>

  <!-- 2. 后层屏幕 (Mac 主控端) -->
  <g filter="url(#shadowBack)">
    <rect x="204" y="260" width="446" height="310" rx="30" fill="url(#bezelWhite)" stroke="#FFFFFF" stroke-width="3.5" />
    <rect x="220" y="276" width="414" height="278" rx="18" fill="url(#wallBack)" />
    <!-- 壁纸极光流光 (左侧发端) -->
    <path d="M 220,440 C 310,360 430,480 634,380 L 634,554 L 220,554 Z" fill="url(#auroraRibbon)" opacity="0.45" />
    <!-- 玻璃反光 -->
    <path d="M 220,276 L 470,276 L 220,526 Z" fill="url(#glassGloss)" />
    <!-- 极简视网膜镜头点 -->
    <circle cx="427" cy="268" r="2.5" fill="#94A3B8" />
  </g>

  <!-- 3. 前层屏幕 (拓展副屏端) -->
  <g filter="url(#shadowFront)">
    <rect x="374" y="420" width="446" height="310" rx="30" fill="url(#bezelWhite)" stroke="#FFFFFF" stroke-width="3.5" />
    <rect x="390" y="436" width="414" height="278" rx="18" fill="url(#wallFront)" />
    <!-- 壁纸极光流光 (右侧延展绽放) -->
    <path d="M 390,560 C 470,470 580,600 804,490 L 804,714 L 390,714 Z" fill="url(#auroraRibbon)" opacity="0.65" />
    <!-- 玻璃反光 -->
    <path d="M 390,436 L 640,436 L 390,686 Z" fill="url(#glassGloss)" />
    <!-- 极简呼吸状态微点 -->
    <circle cx="597" cy="428" r="2.5" fill="#94A3B8" />
  </g>

  <!-- 4. 双屏随航无线连接微光 (优雅悬浮于负空间，与边框留出呼吸感) -->
  <g>
    <!-- 发射源微弧 -->
    <path d="M 338,368 C 364,342 404,342 430,368" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <path d="M 350,380 C 370,360 400,360 420,380" fill="none" stroke="#55FFB0" stroke-width="4" stroke-linecap="round" />
    <circle cx="384" cy="395" r="4" fill="#FFFFFF" />
  </g>
</svg>
