<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景：苹果原生风格的蔚蓝晴空与清泉绿晨光渐变 -->
    <linearGradient id="bgGrad" x1="0.1" y1="0.0" x2="0.9" y2="1.0">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="45%" stop-color="#00B4D8" />
      <stop offset="80%" stop-color="#00E5A3" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>

    <!-- 顶部环境光穹顶 -->
    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 边缘微米级高光描边 -->
    <linearGradient id="rimStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- 图标大底座投影 -->
    <filter id="squircleShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="32" stdDeviation="30" flood-color="#00223e" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#00223e" flood-opacity="0.14" />
    </filter>

    <!-- 显示器立体阴影 -->
    <filter id="dispShadowBack" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#001426" flood-opacity="0.28" />
    </filter>
    <filter id="dispShadowFront" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#001020" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001020" flood-opacity="0.16" />
    </filter>

    <!-- 铝金属与高光边框 -->
    <linearGradient id="metalBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <!-- 屏幕深邃视网膜黑底 -->
    <linearGradient id="retinaGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1F38" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- 跨越双屏的丝绸流光彩带 (Sonoma / Sequoia 风格) -->
    <linearGradient id="ribbonFlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#00F29B" />
      <stop offset="70%" stop-color="#70EE9C" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- 屏幕玻璃对角扫光 -->
    <linearGradient id="glassSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="streamWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F29B" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle 底板 -->
  <g filter="url(#squircleShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)" />
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="url(#rimStroke)" stroke-width="2.5" />
    <path d="M 285,101 L 739,101 C 820,101 880,140 900,220 C 700,260 324,260 124,220 C 144,140 204,101 285,101 Z" fill="url(#topSheen)" />
  </g>

  <!-- 2. 后屏 (Mac 主机视网膜屏幕) -->
  <g filter="url(#dispShadowBack)">
    <!-- 纯白精密边框 -->
    <rect x="200" y="270" width="450" height="310" rx="30" fill="url(#metalBezel)" stroke="#FFFFFF" stroke-width="3" />
    <!-- 视网膜显示面板 -->
    <rect x="216" y="286" width="418" height="278" rx="18" fill="url(#retinaGlass)" />
    
    <!-- 屏内流光 (起点) -->
    <path d="M 216,460 C 290,380 410,500 634,390 L 634,564 L 216,564 Z" fill="url(#ribbonFlow)" opacity="0.5" />
    
    <!-- 玻璃反光 -->
    <path d="M 216,286 L 460,286 L 216,530 Z" fill="url(#glassSweep)" />
    <!-- 摄像头微点 -->
    <circle cx="425" cy="278" r="2.5" fill="#A0AEC0" />
  </g>

  <!-- 3. 前屏 (扩展副屏 / Windows / 平板) 错落叠放 -->
  <g filter="url(#dispShadowFront)">
    <!-- 纯白精密边框 -->
    <rect x="374" y="420" width="450" height="310" rx="30" fill="url(#metalBezel)" stroke="#FFFFFF" stroke-width="3" />
    <!-- 视网膜显示面板 -->
    <rect x="390" y="436" width="418" height="278" rx="18" fill="url(#retinaGlass)" />
    
    <!-- 屏内流光 (延展并绽放) -->
    <path d="M 390,560 C 470,470 580,610 808,490 L 808,714 L 390,714 Z" fill="url(#ribbonFlow)" opacity="0.65" />
    
    <!-- 玻璃反光 -->
    <path d="M 390,436 L 634,436 L 390,680 Z" fill="url(#glassSweep)" />
    <!-- 状态微点 -->
    <circle cx="599" cy="428" r="2.5" fill="#A0AEC0" />
  </g>

  <!-- 4. 双屏随航无线超低延迟能量脉冲流 (在两屏交错空间中纯净呈现) -->
  <g>
    <!-- 三道极简无线微光流束：自然连接主屏与副屏，无任何突兀圆形白徽标 -->
    <path d="M 320,410 C 350,380 390,380 420,410" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <path d="M 334,424 C 356,402 384,402 406,424" fill="none" stroke="#00F29B" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 348,438 C 362,424 378,424 392,438" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
