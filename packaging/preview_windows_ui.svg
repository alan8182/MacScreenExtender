<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" width="580" height="470">
  <defs>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Window Container (Win11 Mica / Acrylic Look) -->
  <rect x="0" y="0" width="580" height="470" rx="10" fill="#F5F5F7" stroke="#E2E8F0" stroke-width="1" />

  <!-- Window Title Bar -->
  <path d="M 0,10 Q 0,0 10,0 L 570,0 Q 580,0 580,10 L 580,36 L 0,36 Z" fill="#F9FAFB" />
  <text x="14" y="23" font-family="-apple-system, 'Microsoft YaHei UI', sans-serif" font-size="12" fill="#374151">Mac 随航拓展屏（MacScreenReceiver）</text>
  <!-- Window Controls -->
  <g transform="translate(460, 10)">
    <line x1="12" y1="8" x2="22" y2="8" stroke="#6B7280" stroke-width="1.2" />
    <rect x="42" y="3" width="10" height="10" fill="none" stroke="#6B7280" stroke-width="1.2" />
    <line x1="72" y1="3" x2="82" y2="13" stroke="#6B7280" stroke-width="1.2" />
    <line x1="82" y1="3" x2="72" y2="13" stroke="#6B7280" stroke-width="1.2" />
  </g>

  <!-- 1. Header & Beacon -->
  <text x="24" y="70" font-family="'Microsoft YaHei UI', sans-serif" font-size="17" font-weight="bold" fill="#111827">Mac 随航无线拓展屏</text>
  <circle cx="29" cy="91" r="4.5" fill="#16A34A" />
  <text x="39" y="95" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#16A34A">已发现 Mac 设备就绪</text>

  <!-- 2. Main Card -->
  <rect x="24" y="112" width="532" height="268" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

  <!-- 2.1 Device Card -->
  <!-- Device Badge Icon -->
  <rect x="44" y="128" width="44" height="44" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
  <text x="66" y="157" font-family="'Segoe UI Emoji', sans-serif" font-size="20" text-anchor="middle" fill="#1E293B">💻</text>
  
  <!-- Device Name & Subtitle -->
  <text x="100" y="146" font-family="'Microsoft YaHei UI', sans-serif" font-size="14.5" font-weight="bold" fill="#111827">我的MacBook Air</text>
  <text x="100" y="167" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#6B7280">192.168.10.114 · 局域网广播高速直连</text>

  <!-- Connect Button -->
  <rect x="442" y="129" width="94" height="40" rx="8" fill="#0071E3" />
  <text x="489" y="154" font-family="'Microsoft YaHei UI', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">连接</text>

  <!-- Divider 1 -->
  <line x1="44" y1="192" x2="536" y2="192" stroke="#F1F5F9" stroke-width="1" />

  <!-- 2.2 Display & Quality Settings -->
  <text x="44" y="220" font-family="'Microsoft YaHei UI', sans-serif" font-size="14" font-weight="bold" fill="#1F2937">显示与画质设置</text>

  <!-- Scale Row -->
  <text x="44" y="254" font-family="'Microsoft YaHei UI', sans-serif" font-size="12.5" fill="#4B5563">显示缩放:</text>
  <rect x="122" y="237" width="414" height="28" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
  <text x="134" y="256" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#111827">100% · 点对点直出 (原生满血最清晰 · 默认)</text>
  <path d="M 520,250 L 525,255 L 530,250" fill="none" stroke="#6B7280" stroke-width="1.5" />

  <!-- Checkboxes -->
  <rect x="44" y="278" width="15" height="15" rx="3" fill="#0071E3" />
  <path d="M 47,285 L 50,288 L 56,281" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  <text x="66" y="291" font-family="'Microsoft YaHei UI', sans-serif" font-size="12.5" fill="#374151">GPU 硬件加速 (Direct3D 11 · 极速低延迟 · 推荐开启)</text>

  <rect x="44" y="306" width="15" height="15" rx="3" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2" />
  <text x="66" y="319" font-family="'Microsoft YaHei UI', sans-serif" font-size="12.5" fill="#374151">超清视网膜渲染 (HiDPI 2x · 建议 1080p 屏开启)</text>

  <!-- Divider 2 -->
  <line x1="44" y1="338" x2="536" y2="338" stroke="#F1F5F9" stroke-width="1" />

  <!-- Manual IP Toggle -->
  <text x="44" y="362" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#0071E3" cursor="pointer">⚙ 手动指定 Mac IP 地址 (跨网段 / VPN 场景)</text>

  <!-- 3. Bottom Status & Shortcut Badges -->
  <text x="26" y="404" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#6B7280">已退出全屏 · 就绪</text>

  <g transform="translate(24, 418)">
    <!-- Esc Badge -->
    <rect x="0" y="0" width="168" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="84" y="20" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#475569" text-anchor="middle">Esc  退出全屏</text>

    <!-- F11 Badge -->
    <rect x="182" y="0" width="168" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="266" y="20" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#475569" text-anchor="middle">F11  切换全屏</text>

    <!-- F1 Badge -->
    <rect x="364" y="0" width="168" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="448" y="20" font-family="'Microsoft YaHei UI', sans-serif" font-size="12" fill="#475569" text-anchor="middle">F1  显隐诊断</text>
  </g>
</svg>
